<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Login - Mandi ERP System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-950 via-slate-900 to-teal-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-amber-400 selection:text-slate-950">

    <div class="w-full max-w-md">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-400 text-emerald-950 rounded-2xl shadow-xl font-bold text-3xl mb-4">
                <i class="fa-solid fa-wheat-awn"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Galla Mandi ERP</h1>
            <p class="text-emerald-300 text-sm mt-1">Dukan / Shopkeeper Login Portal</p>
        </div>

        <!-- Card Container -->
        <div class="bg-slate-900/80 backdrop-blur-xl border border-emerald-500/20 rounded-3xl p-6 sm:p-8 shadow-2xl">
            
            {% if error %}
            <div class="mb-5 p-3.5 bg-rose-500/10 border border-rose-500/30 rounded-2xl flex items-center gap-3 text-rose-300 text-sm">
                <i class="fa-solid fa-circle-exclamation text-rose-400 text-base"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            {% if message %}
            <div class="mb-5 p-3.5 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center gap-3 text-emerald-300 text-sm">
                <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
                <span>{{ message }}</span>
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-emerald-200 mb-2">
                        Username / Phone Number
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <input type="text" id="username" name="username" required placeholder="e.g. shop1 or 03001234567"
                            class="w-full pl-10 pr-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition-all text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-emerald-200 mb-2">
                        Password
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="password" name="password" required placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition-all text-sm">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-slate-400">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" name="remember" class="w-4 h-4 rounded text-amber-400 focus:ring-amber-400 border-slate-700 bg-slate-800">
                        <span>Remember login</span>
                    </label>
                </div>

                <button type="submit"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-bold text-sm rounded-xl shadow-lg transition-transform transform active:scale-98 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket text-base"></i>
                    <span>Log In to Shop</span>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-800 text-center">
                <p class="text-xs text-slate-400">
                    Nayi Dukan Add Karni Hai?
                    <a href="/signup" class="text-amber-400 font-bold hover:underline ml-1">Create New Shop Account</a>
                </p>
            </div>

            <div class="mt-4 p-3 bg-emerald-950/40 rounded-xl border border-emerald-500/20 text-center text-xs text-emerald-300">
                <span class="font-bold text-amber-400">Demo Login:</span> Username: <code class="text-white bg-slate-800 px-1.5 py-0.5 rounded">shop1</code> | Password: <code class="text-white bg-slate-800 px-1.5 py-0.5 rounded">password123</code>
            </div>

        </div>

        <p class="text-center text-xs text-slate-500 mt-6">
            © 2026 Grain Market ERP. Secure Multi-Shop Mandi System.
        </p>
    </div>

</body>
</html>
