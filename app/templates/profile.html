{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Title & Header -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-gradient-to-r from-emerald-900 to-slate-900 text-white p-6 rounded-3xl shadow-lg border border-emerald-800/40">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-amber-400 text-emerald-950 rounded-2xl flex items-center justify-center font-bold text-2xl shadow-md">
                <i class="fa-solid fa-store"></i>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight">{{ current_user.shop_name }}</h1>
                <p class="text-xs text-emerald-300 mt-0.5">Malik: {{ current_user.owner_name }} | City: {{ current_user.city }}</p>
            </div>
        </div>
        <a href="/logout" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl shadow transition-colors flex items-center gap-1.5">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
    </div>

    {% if message %}
    <div class="p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center gap-3 text-emerald-800 text-sm">
        <i class="fa-solid fa-circle-check text-emerald-600 text-base"></i>
        <span>{{ message }}</span>
    </div>
    {% endif %}

    <!-- Shop Details Form -->
    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-emerald-600"></i> Edit Shop Settings & Voucher Branding
        </h2>

        <form action="/profile/update" method="POST" class="space-y-5">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Username (Fixed)
                    </label>
                    <input type="text" disabled value="{{ current_user.username }}"
                        class="w-full px-3.5 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-slate-500 text-sm font-semibold cursor-not-allowed">
                </div>

                <div>
                    <label for="owner_name" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Owner Name (Malik) *
                    </label>
                    <input type="text" id="owner_name" name="owner_name" required value="{{ current_user.owner_name }}"
                        class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label for="shop_name" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    Shop Name (Printed on Vouchers & Reports) *
                </label>
                <input type="text" id="shop_name" name="shop_name" required value="{{ current_user.shop_name }}"
                    class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none font-semibold">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="mobile" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Mobile Number *
                    </label>
                    <input type="text" id="mobile" name="mobile" required value="{{ current_user.mobile or '' }}"
                        class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div>
                    <label for="city" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        City / Mandi Location *
                    </label>
                    <input type="text" id="city" name="city" required value="{{ current_user.city or '' }}"
                        class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label for="new_password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    Change Password (Leave blank to keep current)
                </label>
                <input type="password" id="new_password" name="new_password" placeholder="••••••••"
                    class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div class="pt-2 flex justify-end">
                <button type="submit" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-md transition-transform transform active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Save Profile Settings
                </button>
            </div>

        </form>
    </div>

</div>
{% endblock %}
